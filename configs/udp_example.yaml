title: "AI Box Demo with Remote Inference"
log_level: 2
inputs:
    # RPi camera is supported only in Starter Kit
    # To enable imx219 camera, apply the overlay in /run/media/BOOT-mmcblk1p1/uEnv.txt (Refer to Documentation)
    input0:
        source: udpsrc
        format: jpeg
        udp-port: 5000
        udp-caps: application/x-rtp, media=(string)video, clock-rate=(int)90000, encoding-name=(string)JPEG, a-framerate=(string)30.000000, payload=(int)26, ssrc=(uint)377090114, timestamp-offset=(uint)2244527111, seqnum-offset=(uint)29978
        width: 1280
        height: 720
        framerate: 30
    input1:
        source: /opt/edgeai-test-data/images/pklot/%04d.jpg
        width: 1280
        height: 720
        index: 0
        framerate: 1
        loop: True
models:
    model0:
        model_path: /opt/model_zoo/TVM-CL-3090-mobileNetV2-tv
        topN: 5
    model1:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz_threshold: 0.6
    model2:
        model_path: /opt/model_zoo/ONR-SS-8610-deeplabv3lite-mobv2-ade20k32-512x512
        alpha: 0.4
    model3:
        model_path: /opt/custom_models/20250220-162812_yolox_tiny_lite_onnxrt_AM62A
        viz_threshold: 0.5
outputs:
    output0:
        sink: kmssink
        width: 1920
        height: 1080
        #overlay-perf-type: graph
    output2:
        sink: remote
        width: 1920
        height: 1080
        port: 5000
        host: 10.24.69.219
        encoding: h264

flows:
    flow0: [input0,model3,output0, [320, 180, 1280, 720]]
